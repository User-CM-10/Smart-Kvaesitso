name: Build Smart Kvaesitso APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Default Debug APK
        run: ./gradlew assembleDefaultDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Smart-Kvaesitso-Debug-APK
          path: app/app/build/outputs/apk/default/debug/*.apk
